<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Details</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <div class="card">

      <img src="cute-cat.gif" alt="cute gif" class="gif">

      <h1>Game Details</h1>

      <p class="desc">
        You will play a cute maze game<br>
        Reach the end to get your reward!
      </p>

      <div class="reward">
        Reward: <span>Flower</span>
      </div>

      <div class="how">
        <h3>How to Play:</h3>
        <p>
          Use arrow keys or swipe on mobile to move through the maze and reach the exit.
        </p>
      </div>

      <button class="start-btn" onclick="startGame()">
        Start Game
      </button>

    </div>

  </div>

  <script src="scriptss.js"></script>
</body>
</html>
